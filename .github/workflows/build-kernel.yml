name: Nothing Stock Kernel Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device
        required: true
        default: all
        type: choice
        options:
          - all
          - phone-3a-series
          - phone-4a
      kernel_ref:
        description: Optional NothingOSS branch, tag or commit override
        required: false
        default: ""
        type: string
      create_release:
        description: Create a GitHub Release
        required: true
        default: false
        type: boolean
      developer_mode:
        description: Upload diagnostics when the build fails
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nothing-stock-${{ github.ref }}-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          case "$DEVICE" in
            all)
              matrix='{"include":[{"device":"asteroids","manifest":"manifests/devices/phone-3a-series.json"},{"device":"frogger","manifest":"manifests/devices/phone-4a.json"}]}'
              ;;
            phone-3a-series|phone-4a)
              manifest="manifests/devices/$DEVICE.json"
              codename="$(jq -er '.codename' "$manifest")"
              matrix="$(jq -cn --arg device "$codename" --arg manifest "$manifest" '{include:[{device:$device,manifest:$manifest}]}')"
              ;;
            *)
              printf 'Unsupported device: %s\n' "$DEVICE" >&2
              exit 2
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.device }} stock kernel
        uses: ./.github/actions/build-kernel
        with:
          manifest: ${{ matrix.manifest }}
          kernel_ref: ${{ inputs.kernel_ref }}
          developer_mode: ${{ inputs.developer_mode }}

  release:
    needs: build
    if: ${{ !cancelled() && inputs.create_release && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Package release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-packages

          for artifact_dir in release-assets/*; do
            [[ -d "$artifact_dir" ]] || continue
            artifact_name="$(basename "$artifact_dir")"

            if [[ "$artifact_name" == *-anykernel3 ]]; then
              while IFS= read -r -d '' ak3_zip; do
                cp "$ak3_zip" release-packages/
              done < <(find "$artifact_dir" -type f -name '*.zip' -print0)
            else
              tar -C "$artifact_dir" -czf "release-packages/$artifact_name.tar.gz" .
            fi
          done

          if ! find release-packages -maxdepth 1 -type f -print -quit | grep -q .; then
            printf 'No release packages were created\n' >&2
            exit 1
          fi

          sha256sum release-packages/*

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEVICE: ${{ inputs.device }}
          KERNEL_REF: ${{ inputs.kernel_ref }}
        run: |
          set -Eeuo pipefail
          tag="nothing-stock-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          effective_kernel_ref="${KERNEL_REF:-manifest default}"
          notes="$(printf '%s\n' \
            'Nothing Stock Kernel Builder' \
            '' \
            "Device selection: $DEVICE" \
            "NothingOSS ref: $effective_kernel_ref" \
            '' \
            'Built from unmodified NothingOSS kernel sources.' \
            'AnyKernel3 ZIP files are flashable packages.' \
            'The bootloader must be unlocked.')"

          gh release create \
            "$tag" \
            release-packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nothing Stock Kernel #$GITHUB_RUN_NUMBER" \
            --notes "$notes"
