name: Nothing Kernel Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device
        required: true
        default: all
        type: choice
        options:
          - all
          - phone-3a-series
          - phone-4a
      kernel_ref:
        description: Optional NothingOSS branch, tag or commit override
        required: false
        default: ""
        type: string
      ksun_ref:
        description: KernelSU Next source
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stable
          - custom
      ksun_custom_ref:
        description: Custom KernelSU Next branch, tag or commit
        required: false
        default: ""
        type: string
      ksun_patchset:
        description: Compatibility patches for custom KernelSU Next ref
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stable
      susfs_ref:
        description: SUSFS branch or commit, empty selects android14-6.1 automatically
        required: false
        default: ""
        type: string
      optimize_level:
        description: Compiler optimization level
        required: true
        default: O2
        type: choice
        options:
          - O1
          - O2
          - O3
      custom_patches:
        description: Apply optional custom patches. KSUN, SUSFS and Nothing kernel fixups are always applied.
        required: true
        default: true
        type: boolean
      create_release:
        description: Create GitHub Release or developer prerelease
        required: true
        default: false
        type: boolean
      developer_mode:
        description: Include patch rejects, diffs and logs
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sm7635-${{ github.ref }}-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          case "$DEVICE" in
            all)
              matrix='{"include":[{"device":"asteroids","manifest":"manifests/sm7635/phone-3a-series.json"},{"device":"frogger","manifest":"manifests/sm7635/phone-4a.json"}]}'
              ;;
            phone-3a-series|phone-4a)
              manifest="manifests/sm7635/$DEVICE.json"
              codename="$(jq -er '.codename' "$manifest")"
              matrix="$(jq -cn --arg device "$codename" --arg manifest "$manifest" '{include:[{device:$device,manifest:$manifest}]}')"
              ;;
            *)
              printf 'Unsupported device: %s\n' "$DEVICE" >&2
              exit 2
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Validate custom KernelSU Next ref
        if: ${{ inputs.ksun_ref == 'custom' }}
        shell: bash
        env:
          KSUN_CUSTOM_REF: ${{ inputs.ksun_custom_ref }}
        run: |
          if [[ -z "$KSUN_CUSTOM_REF" ]]; then
            echo "Custom KernelSU Next ref must not be empty" >&2
            exit 2
          fi

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.device }}
        uses: ./.github/actions/build-kernel
        with:
          manifest: ${{ matrix.manifest }}
          kernel_ref: ${{ inputs.kernel_ref }}
          ksun_ref: ${{ inputs.ksun_ref == 'custom' && inputs.ksun_custom_ref || inputs.ksun_ref }}
          ksun_patchset: ${{ inputs.ksun_ref == 'custom' && inputs.ksun_patchset || inputs.ksun_ref }}
          susfs_ref: ${{ inputs.susfs_ref }}
          optimize_level: ${{ inputs.optimize_level }}
          custom_patches: ${{ inputs.custom_patches }}
          developer_mode: ${{ inputs.developer_mode }}

  release:
    needs: build
    if: ${{ !cancelled() && inputs.create_release && (needs.build.result == 'success' || inputs.developer_mode) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Package release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-packages

          for artifact_dir in release-assets/*; do
            [[ -d "$artifact_dir" ]] || continue
            artifact_name="$(basename "$artifact_dir")"

            if [[ "$artifact_name" == *-anykernel3 ]]; then
              while IFS= read -r -d '' ak3_zip; do
                cp "$ak3_zip" release-packages/
              done < <(find "$artifact_dir" -type f -name '*.zip' -print0)
            else
              tar -C "$artifact_dir" -czf "release-packages/$artifact_name.tar.gz" .
            fi
          done

          if ! find release-packages -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "No release packages were created" >&2
            exit 1
          fi

          sha256sum release-packages/*

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEVICE: ${{ inputs.device }}
          KERNEL_REF: ${{ inputs.kernel_ref }}
          KSUN_REF: ${{ inputs.ksun_ref == 'custom' && inputs.ksun_custom_ref || inputs.ksun_ref }}
          KSUN_PATCHSET: ${{ inputs.ksun_ref == 'custom' && inputs.ksun_patchset || inputs.ksun_ref }}
          SUSFS_REF: ${{ inputs.susfs_ref }}
          OPTIMIZE_LEVEL: ${{ inputs.optimize_level }}
          CUSTOM_PATCHES: ${{ inputs.custom_patches }}
          DEVELOPER_MODE: ${{ inputs.developer_mode }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -Eeuo pipefail
          tag="nothing-kernel-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          effective_kernel_ref="${KERNEL_REF:-manifest default}"
          effective_susfs_ref="${SUSFS_REF:-gki-android14-6.1-dev}"

          if [[ "$CUSTOM_PATCHES" == true ]]; then
            tcp_cc=bbr3
          else
            tcp_cc=cubic
          fi

          notes="$(printf '%s\n' \
            'Nothing Kernel Builder' \
            '' \
            "Build result: $BUILD_RESULT" \
            "Developer mode: $DEVELOPER_MODE" \
            "Device selection: $DEVICE" \
            "NothingOSS ref: $effective_kernel_ref" \
            "KernelSU Next ref: $KSUN_REF" \
            "KernelSU Next patchset: $KSUN_PATCHSET" \
            "SUSFS ref: $effective_susfs_ref" \
            "Optimization: $OPTIMIZE_LEVEL" \
            "Custom patches: $CUSTOM_PATCHES" \
            "TCP congestion control: $tcp_cc" \
            '' \
            'AnyKernel3 ZIP files are flashable packages.' \
            'The packages have not yet been boot-tested on physical devices.' \
            'Raw Image files inside the full archives must not be flashed directly with fastboot.')"

          release_flags=()
          release_title="Nothing Kernel Builder #$GITHUB_RUN_NUMBER"

          if [[ "$DEVELOPER_MODE" == true ]]; then
            release_flags+=(--prerelease)
            release_title="Nothing Kernel Builder dev #$GITHUB_RUN_NUMBER"
          fi

          gh release create \
            "$tag" \
            release-packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$release_title" \
            --notes "$notes" \
            "${release_flags[@]}"
