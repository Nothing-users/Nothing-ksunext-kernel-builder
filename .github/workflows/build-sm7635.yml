name: Build SM7635 Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device
        required: true
        default: all
        type: choice
        options:
          - all
          - phone-3a
          - phone-3a-pro
          - phone-4a
      kernel_ref:
        description: Optional NothingOSS branch, tag or commit override
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: sm7635-${{ github.ref }}-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          case "$DEVICE" in
            all)
              matrix='{"include":[{"device":"phone-3a","manifest":"manifests/sm7635/phone-3a.json"},{"device":"phone-3a-pro","manifest":"manifests/sm7635/phone-3a-pro.json"},{"device":"phone-4a","manifest":"manifests/sm7635/phone-4a.json"}]}'
              ;;
            phone-3a|phone-3a-pro|phone-4a)
              matrix="$(jq -cn --arg device "$DEVICE" --arg manifest "manifests/sm7635/$DEVICE.json" '{include:[{device:$device,manifest:$manifest}]}')"
              ;;
            *)
              printf 'Unsupported device: %s\n' "$DEVICE" >&2
              exit 2
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.device }}
        uses: ./.github/actions/build-kernel
        with:
          manifest: ${{ matrix.manifest }}
          kernel_ref: ${{ inputs.kernel_ref }}
