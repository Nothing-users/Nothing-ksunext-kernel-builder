name: Build Nothing SM7635 Kernel
description: Build Nothing SM7635 GKI kernel with KernelSU Next and SUSFS

inputs:
  manifest:
    description: Device manifest path
    required: true
  kernel_ref:
    description: Optional NothingOSS branch, tag or commit override
    required: false
    default: ""
  ksun_ref:
    description: KernelSU Next branch or commit
    required: false
    default: dev
  susfs_ref:
    description: Optional SUSFS branch or commit override
    required: false
    default: ""
  optimize_level:
    description: Compiler optimization level
    required: false
    default: O2

outputs:
  artifact_name:
    description: Uploaded artifact name
    value: ${{ steps.metadata.outputs.artifact_name }}
  image_sha256:
    description: Kernel Image SHA256
    value: ${{ steps.metadata.outputs.image_sha256 }}
  kernel_version:
    description: Built kernel version
    value: ${{ steps.metadata.outputs.kernel_version }}

runs:
  using: composite
  steps:
    - name: Parse and validate manifest
      shell: bash
      env:
        MANIFEST_INPUT: ${{ inputs.manifest }}
        KERNEL_REF_INPUT: ${{ inputs.kernel_ref }}
        KSUN_REF_INPUT: ${{ inputs.ksun_ref }}
        SUSFS_REF_INPUT: ${{ inputs.susfs_ref }}
        OPTIMIZE_LEVEL_INPUT: ${{ inputs.optimize_level }}
      run: |
        set -Eeuo pipefail
        manifest="$GITHUB_WORKSPACE/$MANIFEST_INPUT"

        if [[ ! -f "$manifest" ]]; then
          printf 'Manifest not found: %s\n' "$manifest" >&2
          exit 2
        fi

        jq -e '
          .schema == 1 and
          .soc == "sm7635" and
          .android == "android14-6.1" and
          (.device | test("^[a-z0-9-]+$")) and
          (.kernel.repository | test("^https://")) and
          (.toolchain.repository | test("^https://")) and
          (.kernelsu.repository | test("^https://")) and
          (.susfs.repository | test("^https://"))
        ' "$manifest" >/dev/null

        read_json() {
          jq -er "$1" "$manifest"
        }

        device="$(read_json '.device')"
        kernel_branch="$(read_json '.kernel.branch')"
        kernel_ref="${KERNEL_REF_INPUT:-$kernel_branch}"
        ksun_ref="${KSUN_REF_INPUT:-$(read_json '.kernelsu.branch')}"
        susfs_ref="${SUSFS_REF_INPUT:-$(read_json '.susfs.branch')}"

        if [[ "$ksun_ref" == dev ]]; then
          ksun_ref=dev-susfs
        fi

        case "$OPTIMIZE_LEVEL_INPUT" in
          O1|O2|O3)
            ;;
          *)
            printf 'Unsupported optimization level: %s\n' "$OPTIMIZE_LEVEL_INPUT" >&2
            exit 2
            ;;
        esac

        build_root="$RUNNER_TEMP/sm7635-$device"
        kernel_dir="$build_root/kernel"
        toolchain_dir="$build_root/toolchain"
        susfs_dir="$build_root/susfs4ksu"
        out_dir="$build_root/out"
        artifact_dir="$GITHUB_WORKSPACE/artifacts/$device"

        {
          printf 'MANIFEST_PATH=%s\n' "$manifest"
          printf 'DEVICE=%s\n' "$device"
          printf 'DEVICE_NAME=%s\n' "$(read_json '.name')"
          printf 'CODENAME=%s\n' "$(read_json '.codename')"
          printf 'MODEL=%s\n' "$(read_json '.model')"
          printf 'SOC=%s\n' "$(read_json '.soc')"
          printf 'ANDROID=%s\n' "$(read_json '.android')"
          printf 'KERNEL_REPOSITORY=%s\n' "$(read_json '.kernel.repository')"
          printf 'KERNEL_BRANCH=%s\n' "$kernel_branch"
          printf 'KERNEL_REF=%s\n' "$kernel_ref"
          printf 'KERNEL_DEFCONFIG=%s\n' "$(read_json '.kernel.defconfig')"
          printf 'KERNEL_IMAGE=%s\n' "$(read_json '.kernel.image')"
          printf 'TOOLCHAIN_REPOSITORY=%s\n' "$(read_json '.toolchain.repository')"
          printf 'TOOLCHAIN_BRANCH=%s\n' "$(read_json '.toolchain.branch')"
          printf 'TOOLCHAIN_VERSION=%s\n' "$(read_json '.toolchain.version')"
          printf 'KSU_REPOSITORY=%s\n' "$(read_json '.kernelsu.repository')"
          printf 'KSU_REF=%s\n' "$ksun_ref"
          printf 'SUSFS_REPOSITORY=%s\n' "$(read_json '.susfs.repository')"
          printf 'SUSFS_REF=%s\n' "$susfs_ref"
          printf 'SUSFS_PATCH=%s\n' "$(read_json '.susfs.patch')"
          printf 'OPTIMIZE_LEVEL=%s\n' "$OPTIMIZE_LEVEL_INPUT"
          printf 'BUILD_ROOT=%s\n' "$build_root"
          printf 'KERNEL_DIR=%s\n' "$kernel_dir"
          printf 'TOOLCHAIN_DIR=%s\n' "$toolchain_dir"
          printf 'SUSFS_DIR=%s\n' "$susfs_dir"
          printf 'OUT_DIR=%s\n' "$out_dir"
          printf 'ARTIFACT_DIR=%s\n' "$artifact_dir"
          printf 'CONFIG_FRAGMENT=%s\n' "$GITHUB_WORKSPACE/config/ksunext-susfs.config"
          printf 'CCACHE_DIR=%s\n' "$RUNNER_TEMP/ccache"
        } >> "$GITHUB_ENV"

        rm -rf "$build_root" "$artifact_dir"
        mkdir -p "$build_root" "$artifact_dir" "$RUNNER_TEMP/ccache"

        {
          echo "### Nothing SM7635 build"
          echo ""
          echo "| Field | Value |"
          echo "|---|---|"
          echo "| Device | $(read_json '.name') |"
          echo "| Codename | $(read_json '.codename') |"
          echo "| Kernel ref | \`$kernel_ref\` |"
          echo "| KSUN ref | \`$ksun_ref\` |"
          echo "| SUSFS ref | \`$susfs_ref\` |"
          echo "| Toolchain | \`$(read_json '.toolchain.version')\` |"
          echo "| Optimization | \`$OPTIMIZE_LEVEL_INPUT\` |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Free disk space
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        df -h /

    - name: Install build dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache dwarves file flex git jq libelf-dev libssl-dev libncurses-dev lld llvm python3 rsync zip

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ccache
        key: sm7635-${{ github.sha }}
        restore-keys: |
          sm7635-

    - name: Sync NothingOSS kernel source
      shell: bash
      run: |
        set -Eeuo pipefail
        git init "$KERNEL_DIR"
        git -C "$KERNEL_DIR" remote add origin "$KERNEL_REPOSITORY"
        git -C "$KERNEL_DIR" -c protocol.version=2 fetch \
          --depth=1 \
          --filter=blob:none \
          origin \
          "$KERNEL_REF"
        git -C "$KERNEL_DIR" checkout --detach FETCH_HEAD
        kernel_commit="$(git -C "$KERNEL_DIR" rev-parse HEAD)"
        printf 'KERNEL_COMMIT=%s\n' "$kernel_commit" >> "$GITHUB_ENV"
        printf 'NothingOSS commit: %s\n' "$kernel_commit"

    - name: Sync Android Clang
      shell: bash
      run: |
        set -Eeuo pipefail
        git clone \
          --filter=blob:none \
          --single-branch \
          --branch "$TOOLCHAIN_BRANCH" \
          --depth=1 \
          "$TOOLCHAIN_REPOSITORY" \
          "$TOOLCHAIN_DIR"

        clang_bin="$TOOLCHAIN_DIR/$TOOLCHAIN_VERSION/bin"

        if [[ ! -x "$clang_bin/clang" ]]; then
          printf 'Toolchain not found: %s\n' "$TOOLCHAIN_VERSION" >&2
          exit 1
        fi

        printf '%s\n' "$clang_bin" >> "$GITHUB_PATH"
        clang_version="$("$clang_bin/clang" --version | head -n 1)"
        printf 'CLANG_VERSION=%s\n' "$clang_version" >> "$GITHUB_ENV"
        printf '%s\n' "$clang_version"

    - name: Integrate KernelSU Next
      shell: bash
      run: |
        set -Eeuo pipefail
        git init "$KERNEL_DIR/KernelSU-Next"
        git -C "$KERNEL_DIR/KernelSU-Next" remote add origin "$KSU_REPOSITORY"
        git -C "$KERNEL_DIR/KernelSU-Next" -c protocol.version=2 fetch \
          --filter=blob:none \
          origin \
          "$KSU_REF"
        ksu_target="$(git -C "$KERNEL_DIR/KernelSU-Next" rev-parse FETCH_HEAD)"
        git -C "$KERNEL_DIR/KernelSU-Next" -c protocol.version=2 fetch \
          --filter=blob:none \
          origin \
          '+refs/heads/dev:refs/remotes/origin/dev' \
          '+refs/heads/dev-susfs:refs/remotes/origin/dev-susfs'
        git -C "$KERNEL_DIR/KernelSU-Next" checkout --detach "$ksu_target"

        ln -s ../KernelSU-Next/kernel "$KERNEL_DIR/drivers/kernelsu"

        if ! grep -q 'CONFIG_KSU.*kernelsu/' "$KERNEL_DIR/drivers/Makefile"; then
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$KERNEL_DIR/drivers/Makefile"
        fi

        if ! grep -q 'drivers/kernelsu/Kconfig' "$KERNEL_DIR/drivers/Kconfig"; then
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' "$KERNEL_DIR/drivers/Kconfig"
        fi

        resolved_ksu_commit="$(git -C "$KERNEL_DIR/KernelSU-Next" rev-parse HEAD)"
        printf 'RESOLVED_KSU_COMMIT=%s\n' "$resolved_ksu_commit" >> "$GITHUB_ENV"
        printf 'KernelSU Next ref: %s\n' "$KSU_REF"
        printf 'KernelSU Next commit: %s\n' "$resolved_ksu_commit"

    - name: Sync SUSFS
      shell: bash
      run: |
        set -Eeuo pipefail
        git init "$SUSFS_DIR"
        git -C "$SUSFS_DIR" remote add origin "$SUSFS_REPOSITORY"
        git -C "$SUSFS_DIR" -c protocol.version=2 fetch \
          --depth=1 \
          --filter=blob:none \
          origin \
          "$SUSFS_REF"
        git -C "$SUSFS_DIR" checkout --detach FETCH_HEAD
        resolved_susfs_commit="$(git -C "$SUSFS_DIR" rev-parse HEAD)"
        printf 'RESOLVED_SUSFS_COMMIT=%s\n' "$resolved_susfs_commit" >> "$GITHUB_ENV"
        printf 'SUSFS ref: %s\n' "$SUSFS_REF"
        printf 'SUSFS commit: %s\n' "$resolved_susfs_commit"

    - name: Apply SUSFS patches
      shell: bash
      run: |
        set -Eeuo pipefail
        sublevel="$(awk '/^SUBLEVEL =/{print $3; exit}' "$KERNEL_DIR/Makefile")"
        printf 'KERNEL_SUBLEVEL=%s\n' "$sublevel" >> "$GITHUB_ENV"

        if (( sublevel <= 141 )) && ! grep -q '^#include <linux/dma-buf.h>$' "$KERNEL_DIR/fs/proc/base.c"; then
          sed -i '/^#include <linux\/cpufreq_times.h>$/a #include <linux/dma-buf.h>' "$KERNEL_DIR/fs/proc/base.c"
        fi

        if (( sublevel >= 157 )); then
          sed -i '/^#include <trace\/hooks\/blk.h>$/d' "$KERNEL_DIR/fs/namespace.c"
        fi

        cp -a "$SUSFS_DIR/kernel_patches/fs/." "$KERNEL_DIR/fs/"
        cp -a "$SUSFS_DIR/kernel_patches/include/linux/." "$KERNEL_DIR/include/linux/"
        patch --directory="$KERNEL_DIR" --batch --forward -p1 < "$SUSFS_DIR/$SUSFS_PATCH"

        if find "$KERNEL_DIR" -type f -name '*.rej' -print -quit | grep -q .; then
          find "$KERNEL_DIR" -type f -name '*.rej' -print >&2
          exit 1
        fi

    - name: Configure kernel
      shell: bash
      run: |
        set -Eeuo pipefail
        export ARCH=arm64
        export LLVM=1
        export LLVM_IAS=1
        export CCACHE_COMPILERCHECK=content
        export CCACHE_NOHASHDIR=true

        mkdir -p "$OUT_DIR" "$CCACHE_DIR"
        ccache --max-size=5G
        ccache --zero-stats

        make \
          -C "$KERNEL_DIR" \
          O="$OUT_DIR" \
          ARCH="$ARCH" \
          LLVM="$LLVM" \
          LLVM_IAS="$LLVM_IAS" \
          CC="ccache clang" \
          HOSTCC="ccache clang" \
          "$KERNEL_DEFCONFIG"

        while IFS='=' read -r option value; do
          [[ -z "$option" ]] && continue
          symbol="${option#CONFIG_}"
          case "$value" in
            y)
              "$KERNEL_DIR/scripts/config" --file "$OUT_DIR/.config" -e "$symbol"
              ;;
            n)
              "$KERNEL_DIR/scripts/config" --file "$OUT_DIR/.config" -d "$symbol"
              ;;
            *)
              "$KERNEL_DIR/scripts/config" --file "$OUT_DIR/.config" --set-val "$symbol" "$value"
              ;;
          esac
        done < "$CONFIG_FRAGMENT"

        make \
          -C "$KERNEL_DIR" \
          O="$OUT_DIR" \
          ARCH="$ARCH" \
          LLVM="$LLVM" \
          LLVM_IAS="$LLVM_IAS" \
          CC="ccache clang" \
          HOSTCC="ccache clang" \
          olddefconfig

        while IFS= read -r expected; do
          [[ -z "$expected" ]] && continue
          if ! grep -qxF "$expected" "$OUT_DIR/.config"; then
            printf 'Required config was not enabled: %s\n' "$expected" >&2
            exit 1
          fi
        done < "$CONFIG_FRAGMENT"

    - name: Build kernel Image
      id: build
      shell: bash
      run: |
        set -Eeuo pipefail
        export ARCH=arm64
        export LLVM=1
        export LLVM_IAS=1
        export KBUILD_BUILD_USER=github-actions
        export KBUILD_BUILD_HOST=github
        export KBUILD_BUILD_TIMESTAMP
        export SOURCE_DATE_EPOCH
        export CCACHE_COMPILERCHECK=content
        export CCACHE_NOHASHDIR=true

        KBUILD_BUILD_TIMESTAMP="$(git -C "$KERNEL_DIR" show -s --format=%cD HEAD)"
        SOURCE_DATE_EPOCH="$(git -C "$KERNEL_DIR" show -s --format=%ct HEAD)"
        kernel_cflags="-$OPTIMIZE_LEVEL"
        build_start="$(date +%s)"

        printf 'Compiler optimization: %s\n' "$kernel_cflags"

        make \
          -C "$KERNEL_DIR" \
          O="$OUT_DIR" \
          ARCH="$ARCH" \
          LLVM="$LLVM" \
          LLVM_IAS="$LLVM_IAS" \
          CC="ccache clang" \
          HOSTCC="ccache clang" \
          KCFLAGS="$kernel_cflags" \
          -j"$(nproc)" \
          Image 2>&1 | tee "$BUILD_ROOT/build.log"

        build_end="$(date +%s)"
        build_time="$((build_end - build_start))"
        printf 'BUILD_TIME=%s\n' "$build_time" >> "$GITHUB_ENV"

        if [[ ! -s "$OUT_DIR/$KERNEL_IMAGE" ]]; then
          printf 'Kernel image was not produced: %s\n' "$OUT_DIR/$KERNEL_IMAGE" >&2
          exit 1
        fi

        printf 'Build time: %sm %ss\n' "$((build_time / 60))" "$((build_time % 60))"
        file "$OUT_DIR/$KERNEL_IMAGE"
        ccache --show-stats

    - name: Collect build artifacts
      id: metadata
      shell: bash
      run: |
        set -Eeuo pipefail
        cp "$OUT_DIR/$KERNEL_IMAGE" "$ARTIFACT_DIR/Image"
        cp "$OUT_DIR/.config" "$ARTIFACT_DIR/kernel.config"
        cp "$BUILD_ROOT/build.log" "$ARTIFACT_DIR/build.log"

        if [[ -f "$OUT_DIR/System.map" ]]; then
          cp "$OUT_DIR/System.map" "$ARTIFACT_DIR/System.map"
        fi

        image_sha256="$(sha256sum "$ARTIFACT_DIR/Image" | awk '{print $1}')"
        kernel_version="6.1.$KERNEL_SUBLEVEL"
        artifact_name="$DEVICE-ksunext-susfs"

        jq -n \
          --arg device "$DEVICE" \
          --arg name "$DEVICE_NAME" \
          --arg codename "$CODENAME" \
          --arg model "$MODEL" \
          --arg soc "$SOC" \
          --arg android "$ANDROID" \
          --arg kernel_repository "$KERNEL_REPOSITORY" \
          --arg kernel_ref "$KERNEL_REF" \
          --arg kernel_commit "$KERNEL_COMMIT" \
          --arg kernel_version "$kernel_version" \
          --arg kernelsu_repository "$KSU_REPOSITORY" \
          --arg kernelsu_ref "$KSU_REF" \
          --arg kernelsu_commit "$RESOLVED_KSU_COMMIT" \
          --arg susfs_repository "$SUSFS_REPOSITORY" \
          --arg susfs_ref "$SUSFS_REF" \
          --arg susfs_commit "$RESOLVED_SUSFS_COMMIT" \
          --arg toolchain "$CLANG_VERSION" \
          --arg optimize_level "$OPTIMIZE_LEVEL" \
          --arg image_sha256 "$image_sha256" \
          --argjson build_time "$BUILD_TIME" \
          '{
            device: $device,
            name: $name,
            codename: $codename,
            model: $model,
            soc: $soc,
            android: $android,
            kernel: {
              repository: $kernel_repository,
              ref: $kernel_ref,
              commit: $kernel_commit,
              version: $kernel_version
            },
            kernelsu: {
              repository: $kernelsu_repository,
              ref: $kernelsu_ref,
              commit: $kernelsu_commit
            },
            susfs: {
              repository: $susfs_repository,
              ref: $susfs_ref,
              commit: $susfs_commit
            },
            toolchain: $toolchain,
            optimize_level: $optimize_level,
            image_sha256: $image_sha256,
            build_time_seconds: $build_time
          }' > "$ARTIFACT_DIR/build.json"

        {
          printf 'artifact_name=%s\n' "$artifact_name"
          printf 'image_sha256=%s\n' "$image_sha256"
          printf 'kernel_version=%s\n' "$kernel_version"
        } >> "$GITHUB_OUTPUT"

        {
          echo ""
          echo "### Build result"
          echo ""
          echo "| Field | Value |"
          echo "|---|---|"
          echo "| Kernel | \`$kernel_version\` |"
          echo "| Image SHA256 | \`$image_sha256\` |"
          echo "| Build time | \`${BUILD_TIME}s\` |"
          echo "| Optimization | \`$OPTIMIZE_LEVEL\` |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.metadata.outputs.artifact_name }}
        path: artifacts
        if-no-files-found: error
        compression-level: 6

    - name: Show patch rejects
      if: failure()
      shell: bash
      run: |
        find "$BUILD_ROOT" -type f -name "*.rej" -print -exec sed -n '1,240p' {} \; 2>/dev/null || true
